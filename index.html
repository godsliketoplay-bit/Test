function load(k,d){try{var x=JSON.parse(localStorage.getItem(k));return x===null?clone(d):x}catch(e){return clone(d)}}function clone(x){return JSON.parse(JSON.stringify(x))}function save(){localStorage.setItem(CFG,JSON.stringify(config));localStorage.setItem(KEY,JSON.stringify(records))}function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function localISO(d){d=d||new Date();var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}function actualToday(){return localISO(new Date())}function today(){return config.workDate||actualToday()}function now(){var real=new Date(),base=new Date(today()+'T00:00:00');base.setHours(real.getHours(),real.getMinutes(),real.getSeconds(),real.getMilliseconds());return {iso:today(),date:base.toLocaleDateString('fr-FR'),time:base.toLocaleTimeString('fr-FR'),stamp:real.toISOString()}}function setWorkDate(v){if(!v)return;config.workDate=v;save();home()}function isClosedDate(d){var dt=new Date(d+'T12:00:00'),wd=dt.getDay(),sc=config.schedule||{};return (sc.weekdays||[]).indexOf(wd)<0||(sc.closures||[]).indexOf(d)>=0||(sc.holidays||[]).indexOf(d)>=0}function workHoursLabel(){var h=config.scheduleHours||{};return h.enabled&&h.start&&h.end?' · Horaires : '+h.start+'–'+h.end:''} function mod(k){if(k==='menu_control')return ['menu_control','🍽️','Contrôle lié au menu','daily'];if(k==='menu_dish_control')return ['menu_dish_control','🍽️','Contrôle HACCP du plat','daily'];if(k==='custom_task')return ['custom_task','☑️','Tâche personnalisée','daily'];if(k==='menu_stage')return ['menu_stage','🍳','Étapes cuisson / maintien / service','daily'];if(k==='cleaning_session'||k==='cleaning_task')return [k,'🧽','Nettoyage / désinfection','daily'];if(k==='daily_tick')return ['daily_tick','☑️','Contrôles quotidiens','daily'];if(k==='menu_served')return ['menu_served','🍽️','Menu effectivement servi function readFiles(id,maxEach){var el=document.getElementById(id||'file'),fs=el&&el.files?Array.from(el.files):[];if(!fs.length)return Promise.resolve([]);maxEach=maxEach||5000000;for(var i=0;i<fs.length;i++){if(fs[i].size>maxEach){alert('Fichier trop volumineux : '+fs[i].name+' (maximum '+Math.round(maxEach/1000000)+' Mo).');return Promise.resolve(null)}}return Promise.all(fs.map(function(f){return new Promise(function(resolve){var r=new FileReader();r.onload=function(){resolve({name:f.name,type:f.type,data:r.result})};r.readAsDataURL(f)})}))}function fileData(){return readFiles('file',5000000).then(function(a){return a&&a.length?a:null})}function attachmentsOf(r){if(!r)return [];if(Array.isArray(r.attachments))return r.attachments;if(r.attachment)return [r.attachment];return []}function addRecord(k,data){return fileData().then(function(a){var n=now();records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),module:k,createdAt:n.stamp,iso:n.iso,date:n.date,time:n.time,operator:data.operator||'',data:data,attachment:null,attachments:a||[],corrections:[]});save();home()})}

function cleaningDueToday(task){
var d=today(),dt=new Date(d+'T12:00:00'),wd=dt.getDay();
if(!task.active)return false;
if(task.startDate&&d<task.startDate)return false;
if(task.endDate&&d>task.endDate)return false;
var freq=task.frequency||'daily';
if(freq==='daily')return true;
if(freq==='weekly')return (task.weekdays||[]).indexOf(wd)>=0;
if(freq==='biweekly'){
  if((task.weekdays||[]).indexOf(wd)<0)return false;
  var base=task.startDate||d,bd=new Date(base+'T12:00:00'),diff=Math.floor((dt-bd)/86400000);
  return diff>=0 && Math.floor(diff/7)%2===0;
}
if(freq==='monthly')return dt.getDate()===Number(task.dayOfMonth||1);
if(freq==='interval'){
  var base2=task.startDate||d,bd2=new Date(base2+'T12:00:00'),diff2=Math.floor((dt-bd2)/86400000),n=Number(task.intervalDays||14);
  return diff2>=0 && diff2%n===0;
}
return false;
}

  if(s2.length>1)sheets.push({name:'Températures stockage',rows:s2});
  // 3. Réceptions (livraisons)
  var s3=[['Date','Heure','Opérateur','Source','Fournisseur','Catégorie','Produit/Lot','DLC/DDM','Température °C','Chaîne du froid','Emplacement de stockage','Décision','Observation']];
  xlByModule('deliveries').forEach(function(r){var d=r.data;s3.push([r.date,r.time,r.operator||'',d.source||'',d.supplier||'',d.category||'',d.lot||'',d.dlc||'',d.temperature||'',d.coldChain||'',d.storage||'',d.decision||'',d.observation||''])});
  if(s3.length>1)sheets.push({name:'Réceptions',rows:s3});
  // 4. Cuissons
  var s4=[['Date','Heure','Plat','Rubrique','Étape','Température °C','Équipement','Départ','Fin','Durée (min)','Observation','Opérateur']];
  xlDishStages(['cooking','frozenDirect']).forEach(function(r){s4.push(r)});
  if(s4.length>1)sheets.push({name:'Cuissons',rows:s4});
  // 5. Refroidissement
  var s5=[['Date','Heure','Plat','Rubrique','Étape','Température °C','Équipement','Départ °C','Fin °C','Durée (min)','Observation','Opérateur']];
  xlDishStages(['cooling']).forEach(function(r){s5.push(r)});
  if(s5.length>1)sheets.push({name:'Refroidissement',rows:s5});
  // 6. Remise en température
  var s6=[['Date','Heure','Plat','Rubrique','Étape','Température °C','Équipement','Départ °C','Atteinte °C','Durée (min)','Observation','Opérateur']];
  xlDishStages(['reheating']).forEach(function(r){s6.push(r)});
  if(s6.length>1)sheets.push({name:'Remise en température',rows:s6});
  // 7. Maintien & Distribution
  var s7=[['Date','Heure','Plat','Rubrique','Étape','Température °C','Équipement','Heure de service','Fin','Durée (min)','Observation','Opérateur']];
  xlDishStages(['holding','distribution']).forEach(function(r){s7.push(r)});
  if(s7.length>1)sheets.push({name:'Maintien & Distribution',rows:s7});
  // 8. Échantillons témoins
  var s8=[['Date','Heure','Plat','Rubrique','Conforme','Conditions de conservation','Observation','Opérateur']];
  xlByModule('samples').forEach(function(r){var d=r.data;s8.push([r.date,r.time,d.preparation||'',d.slot||'',d.conforme?'Oui':'Non',d.retention||'',d.observation||'',r.operator||''])});
  if(s8.length>1)sheets.push({name:'Échantillons témoins',rows:s8});
  // 9. Nettoyage
  var s9=[['Date','Heure','Type','Tâche / Résumé','Opérateur']];
  xlByModule('cleaning_task').forEach(function(r){s9.push([r.date,r.time,'Tâche',r.data.task||'',r.operator||''])});
  xlByModule('cleaning_session').forEach(function(r){s9.push([r.date,r.time,'Session',(r.data.completedCount||0)+'/'+(r.data.totalCount||0)+' — '+(r.data.summary||''),r.operator||''])});
  if(s9.length>1)sheets.push({name:'Nettoyage',rows:s9});
  // 10. Traçabilité
  var s10=[['Produit / ingrédient','Source','Fournisseur','N° de lot','DLC/DDM','Température réception °C','Stockage','Chaîne du froid','Observation','Actif']];
  (config.traceLots||[]).forEach(function(l){s10.push([l.product||'',l.source||'',l.supplier||'',l.lot||'',l.dlc||'',l.receptionTemp||'',l.storage||'',l.coldChain||'',l.observation||'',l.active===false?'Non':'Oui'])});
  if(s10.length>1)sheets.push({name:'Traçabilité',rows:s10});
  // 11. Ingrédients & allergènes
  var s11=[['Produit','Catégorie','Fournisseur','Lieu de stockage','Règle de conservation','Allergènes']];
  (config.ingredients||[]).forEach(function(i){s11.push([i.name||'',i.category||'',i.supplier||'',i.storageLocation||'',i.storageRule||'',(i.allergens||[]).join(', ')])});
  if(s11.length>1)sheets.push({name:'Ingrédients & allergènes',rows:s11});
  // 12. Non-conformités (agrégation transversale)
  var flagWords=['Non conforme','Anomalie constatée','Écart constaté','Non servi','Remplacé'];
  var s12=[['Date','Heure','Catégorie','Détail','Opérateur']];
  records.forEach(function(r){
    var flat=JSON.stringify(r.data||{});
    var hit=flagWords.find(function(w){return flat.indexOf(w)>=0});
    if(hit)s12.push([r.date,r.time,friendlyModule(r.module),hit,r.operator||'']);
  });
  if(s12.length>1)sheets.push({name:'Non-conformités',rows:s12});
  // 13. Matériel / Inventaire
  var s13=[['Type','Nom / description']];
  (config.equipment||[]).forEach(function(e){s13.push(['Équipement froid/chaud',typeof e==='string'?e:(e.name||JSON.stringify(e))])});
  (config.cleaningPlan||[]).forEach(function(t){s13.push(['Élément de nettoyage',t.name||''])});
  if(s13.length>1)sheets.push({name:'Matériel / Inventaire',rows:s13});
  // 14. Déchets
  var s14=[['Date','Heure','Contrôle','Observation','Opérateur']];
  xlByModule('daily_tick').forEach(function(r){if(r.data.taskId==='waste')s14.push([r.date,r.time,r.data.check||'',r.data.observation||'',r.operator||''])});
  if(s14.length>1)sheets.push({name:'Déchets',rows:s14});
  // 15. Menu servi & tâches diverses (archives / événements)
  var s15=[['Date','Heure','Type','Détail','Opérateur']];
  xlByModule('menu_served').forEach(function(r){(r.data.items||[]).forEach(function(it){s15.push([r.date,r.time,'Menu servi',it.slot+' — '+it.name+' ('+it.status+')',r.operator||''])})});
  xlByModule('custom_task').forEach(function(r){s15.push([r.date,r.time,'Tâche personnalisée',r.data.task||r.data.label||'',r.operator||''])});
  if(s15.length>1)sheets.push({name:'Archives / Événements',rows:s15});
  // 16. Historique des corrections
  var s16=[['Date','Heure','Catégorie corrigée','Champ','Ancienne valeur','Nouvelle valeur','Motif','Opérateur']];
  records.forEach(function(r){(r.corrections||[]).forEach(function(c){s16.push([c.date||'',c.time||'',friendlyModule(r.module),friendlyField(c.field||''),c.oldValue!=null?c.oldValue:'',c.newValue!=null?c.newValue:'',c.reason||'',c.operator||''])})});
  if(s16.length>1)sheets.push({name:'Historique corrections',rows:s16});
  return sheets;
}
function exportExcel(){
  var sheets=excelSheets();
  if(!sheets.length){alert('Aucune donnée à exporter pour le moment.');return}
  var zipBytes=buildWorkbookXLSX(sheets);
  var blob=new Blob([zipBytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  triggerDownload(blob,'cahier_sanitaire_export_'+actualToday()+'.xlsx');
}
